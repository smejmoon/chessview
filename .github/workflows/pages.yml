name: Test, build, and publish Pages

on:
  push:
    branches-ignore:
      - gh-pages
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run deterministic tests
        run: npm test

      - name: Determine Pages target
        id: pages
        shell: bash
        run: |
          set -euo pipefail

          branch="${GITHUB_REF_NAME}"
          if [[ "$branch" == "main" ]]; then
            echo "base=/chessview/" >> "$GITHUB_OUTPUT"
            echo "target=." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          slug="$branch"
          if [[ ! "$slug" =~ ^[A-Za-z0-9._-]+$ ]]; then
            slug="$(printf '%s' "$branch" | sed -E 's/[^A-Za-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
            hash="$(printf '%s' "$branch" | sha256sum | cut -c1-8)"
            if [[ -z "$slug" || "$slug" == "." || "$slug" == ".." ]]; then
              slug="branch"
            fi
            slug="${slug}-${hash}"
          fi

          echo "base=/chessview/previews/${slug}/" >> "$GITHUB_OUTPUT"
          echo "target=previews/${slug}" >> "$GITHUB_OUTPUT"

      - name: Build static site
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base }}
        run: npm run build -- --base "$PAGES_BASE"

      - name: Publish dist to gh-pages
        env:
          PAGES_TARGET: ${{ steps.pages.outputs.target }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          git worktree add --detach pages refs/remotes/origin/gh-pages

          if [[ "$PAGES_TARGET" == "." ]]; then
            if [[ "$GITHUB_REF_NAME" != "main" ]]; then
              echo "Refusing to publish a non-main branch at the production root" >&2
              exit 1
            fi
            if [[ -e dist/previews ]]; then
              echo "Refusing to overwrite the reserved previews/ subtree" >&2
              exit 1
            fi
            find pages -mindepth 1 -maxdepth 1 ! -name .git ! -name previews -exec rm -rf -- {} +
            cp -a dist/. pages/
          else
            if [[ "$GITHUB_REF_NAME" == "main" || "$PAGES_TARGET" != previews/* ]]; then
              echo "Refusing to publish outside the preview subtree" >&2
              exit 1
            fi
            rm -rf -- "pages/$PAGES_TARGET"
            mkdir -p -- "pages/$PAGES_TARGET"
            cp -a dist/. "pages/$PAGES_TARGET/"
          fi

          touch pages/.nojekyll
          git -C pages config user.name "github-actions[bot]"
          git -C pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C pages add --all

          if git -C pages diff --cached --quiet; then
            echo "No Pages changes to publish"
            exit 0
          fi

          git -C pages commit -m "Deploy ${GITHUB_REF_NAME} ${GITHUB_SHA}"
          git -C pages push origin HEAD:gh-pages
